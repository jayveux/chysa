<html>
    <head>
        <title>HOME</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <style>
            /* Pola background terbagi dua (Pink & Kuning Pastel) dengan motif bintang selang-seling */
            .star-split-bg {
                background-image: 
                    /* Bintang kuning pastel untuk bagian atas */
                    url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpolygon points='15,4 18,11 25,11 19,16 21,23 15,18 9,23 11,16 5,11 12,11' fill='%23f3eeb7'/%3E%3Cpolygon points='45,34 48,41 55,41 49,46 51,53 45,48 39,53 41,46 35,41 42,41' fill='%23f3eeb7'/%3E%3C/svg%3E"),
                    /* Bintang pink untuk bagian bawah */
                    url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpolygon points='15,4 18,11 25,11 19,16 21,23 15,18 9,23 11,16 5,11 12,11' fill='%23de7b98'/%3E%3Cpolygon points='45,34 48,41 55,41 49,46 51,53 45,48 39,53 41,46 35,41 42,41' fill='%23de7b98'/%3E%3C/svg%3E"),
                    /* Warna dasar terbagi 50% atas Pink, 50% bawah Kuning Pastel */
                    linear-gradient(to bottom, #de7b98 0%, #de7b98 50%, #f3eeb7 50%, #f3eeb7 100%);
                background-size: 60px 60px, 60px 60px, 100% 100%;
                background-repeat: repeat, repeat, no-repeat;
                /* Membatasi area bintang atas hanya di 50% atas, dan bintang bawah di 50% bawah */
                -webkit-mask-image: linear-gradient(black, black);
            }

            /* Memisahkan layer bintang atas dan bawah secara presisi */
            .bg-top-stars {
                background-color: #de7b98;
                background-image: url("data:image/svg+xml,%3Csvg width='64' height='64' viewBox='0 0 64 64' xmlns='http://www.w3.org/2000/svg'%3E%3Cpolygon points='16,6 19,13 26,13 20,18 22,25 16,20 10,25 12,18 6,13 13,13' fill='%23f3eeb7'/%3E%3Cpolygon points='48,38 51,45 58,45 52,50 54,57 48,52 42,57 44,50 38,45 45,45' fill='%23f3eeb7'/%3E%3C/svg%3E");
                background-size: 64px 64px;
            }

            .bg-bottom-stars {
                background-color: #f3eeb7;
                background-image: url("data:image/svg+xml,%3Csvg width='64' height='64' viewBox='0 0 64 64' xmlns='http://www.w3.org/2000/svg'%3E%3Cpolygon points='16,6 19,13 26,13 20,18 22,25 16,20 10,25 12,18 6,13 13,13' fill='%23de7b98'/%3E%3Cpolygon points='48,38 51,45 58,45 52,50 54,57 48,52 42,57 44,50 38,45 45,45' fill='%23de7b98'/%3E%3C/svg%3E");
                background-size: 64px 64px;
            }
        </style>
    </head>
    <body>
        <div class="relative min-h-screen w-full overflow-hidden flex items-center justify-center p-4">

          <div class="absolute bottom-80 right-80 transform -rotate-12 hover:scale-110 transition duration-300 select-none z-10">

          </div>

          <div class="absolute bottom-50 right-10 transform rotate-12 hover:scale-110 transition duration-300 z-10 animate-bounce">
            <span class="text-5xl drop-shadow-[4px_4px_0px_rgba(236,72,153,1)]">
              <img src="download__18_-removebg-preview.png" alt="" class="w-40">
            </span>
          </div>
          
          <div class="absolute top-5 left-5 transform z-10">
            <span class="text-7xl">
              <img src="1126181450599451893-removebg-preview.png" alt="" class="w-40">
            </span>
          </div>
          
          <div class="absolute bottom-5 right-5 transform -rotate-12 z-10">
            <span class="text-8xl drop-shadow-lg"></span>
            <img src="download__16_-removebg-preview.png" alt="" class="w-80">
          </div>

          <div class="relative z-10 flex flex-col items-center">
            
            <div class="flex flex-wrap justify-center gap-2 md:gap-4 mb-4">
              <div class="bg-gray-800 text-white font-serif text-6xl md:text-8xl p-4 transform -rotate-6 shadow-lg border-2 border-white">C</div>
              <div class="bg-pink-500 text-white font-sans font-bold text-6xl md:text-8xl p-4 transform rotate-3 shadow-lg border-2 border-white">H</div>
              <div class="bg-yellow-200 text-pink-500 font-mono text-6xl md:text-8xl p-4 transform -rotate-3 shadow-lg border-2 border-white italic">Y</div>
              <div class="bg-white text-gray-900 font-serif text-6xl md:text-8xl p-4 transform rotate-6 shadow-lg border-2 border-white underline">S</div>
              <div class="bg-pink-300 text-white font-bold text-5xl md:text-7xl p-3 self-end transform -rotate-12 shadow-md italic">A</div>
            </div>

            <div class="bg-purple-600 px-10 py-2 rounded-full border-4 border-yellow-300 shadow-[8px_8px_0px_rgba(0,0,0,0.2)] transform hover:scale-110 transition duration-300 select-none">

            XOXO
          </div>
          
          <div class="absolute top-1/2 left-10 text-4xl animate-bounce z-10">

          </div>

        </div>
    </body>
</html>
